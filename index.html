<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Us Only 💕</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body, html { 
            height: 100%; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #333;
        }

        .app-container {
            width: 100%;
            height: 100%;
            max-width: 430px;
            max-height: 850px;
            position: relative;
            background: #005c4b;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        @media (min-width: 481px) {
            .app-container {
                border-radius: 32px;
                border: 8px solid #2d2d2d;
            }
        }

        /* Auth Screen */
        #auth-screen {
            height: 100%;
            width: 100%;
            background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)), url('hands.png') center/cover no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 25px 20px;
            border-radius: 20px;
            width: 88%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
        }

        .auth-card h2 { color: #008069; margin-bottom: 15px; font-size: 22px; }

        .tab-buttons {
            display: flex;
            margin-bottom: 15px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #008069;
        }

        .tab-btn {
            flex: 1;
            padding: 8px;
            background: #fff;
            border: none;
            cursor: pointer;
            font-weight: bold;
            color: #008069;
        }

        .tab-btn.active {
            background: #008069;
            color: #fff;
        }

        .auth-card select, .auth-card input {
            width: 100%; padding: 10px 12px; margin-bottom: 10px;
            border: 1px solid #ccc; border-radius: 10px; outline: none; font-size: 14px;
        }

        .auth-btn {
            width: 100%; padding: 12px; background: #008069; color: white;
            border: none; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer;
        }

        .error-msg {
            color: #d90429; font-size: 13px; margin-bottom: 10px; display: none; font-weight: bold;
        }

        /* Main View Container */
        #main-app {
            height: 100%;
            width: 100%;
            display: none;
            flex-direction: column;
            background: #fff;
        }

        /* Top WhatsApp Header */
        .wa-header {
            background: #008069;
            color: white;
            padding: 12px 16px 4px 16px;
            display: flex;
            flex-direction: column;
        }

        .wa-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .wa-header-icons button {
            background: transparent;
            border: none;
            color: white;
            font-size: 18px;
            margin-left: 14px;
            cursor: pointer;
        }

        /* Tab Bar */
        .wa-tabs {
            display: flex;
            justify-content: space-around;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.7);
        }

        .wa-tab {
            padding-bottom: 8px;
            flex: 1;
            cursor: pointer;
            text-align: center;
        }

        .wa-tab.active {
            color: #fff;
            border-bottom: 3px solid #fff;
        }

        /* Chat Panel (List View) */
        #chat-panel {
            flex: 1;
            background: #fff;
            overflow-y: auto;
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
        }

        .chat-item:hover { background: #f5f5f5; }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            margin-right: 14px;
            object-fit: cover;
            background: #ccc;
        }

        .chat-info { flex: 1; }
        .chat-name { font-weight: bold; font-size: 16px; color: #111; display: flex; justify-content: space-between; }
        .chat-time { font-size: 12px; color: #888; font-weight: normal; }
        .chat-last-msg { font-size: 13px; color: #666; margin-top: 4px; display: flex; justify-content: space-between; }
        .unread-badge { background: #25d366; color: white; border-radius: 50%; padding: 2px 6px; font-size: 11px; font-weight: bold; }

        /* Individual Active Chat Room Screen */
        #chat-room {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)), url('twoofus.png') center/cover no-repeat;
            display: none;
            flex-direction: column;
            z-index: 10;
        }

        .room-header {
            background: #008069;
            color: white;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .room-header .back-btn {
            background: none; border: none; color: white; font-size: 20px; cursor: pointer;
        }

        .room-header .user-title { flex: 1; font-weight: bold; font-size: 16px; }

        .room-header button {
            background: none; border: none; color: white; font-size: 18px; cursor: pointer; margin-left: 8px;
        }

        #chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }

        /* Left / Right Messages */
        .message {
            max-width: 75%;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 15px;
            word-wrap: break-word;
            line-height: 1.4;
            box-shadow: 0 1px 2px rgba(0,0,0,0.15);
        }

        .sent {
            background: #d9fdd3;
            color: #111;
            align-self: flex-end;
            border-top-right-radius: 2px;
        }

        .received {
            background: #ffffff;
            color: #111;
            align-self: flex-start;
            border-top-left-radius: 2px;
        }

        .input-area { padding: 8px; background: #f0f0f0; display: flex; gap: 8px; align-items: center; }
        .input-area input { flex: 1; padding: 10px 14px; border: none; border-radius: 20px; outline: none; font-size: 15px; }
        .send-btn { background: #008069; color: white; border: none; padding: 10px 16px; border-radius: 50%; font-weight: bold; cursor: pointer; }

        /* Video / Call Screen Container */
        #video-container { display: none; background: #000; position: relative; height: 220px; width: 100%; }
        video { width: 100%; height: 100%; object-fit: cover; }
        #local-video { width: 80px; height: 110px; position: absolute; bottom: 10px; right: 10px; border: 2px solid white; border-radius: 8px; z-index: 10; }
        .end-call-btn { position: absolute; top: 10px; right: 10px; background: #ff3333; color: white; border: none; padding: 6px 12px; border-radius: 12px; cursor: pointer; z-index: 11; font-weight: bold; }

        /* Settings Modal Overlay */
        #settings-modal {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 30;
            justify-content: center;
            align-items: center;
        }

        .settings-card {
            background: #fff;
            width: 85%;
            max-width: 340px;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .settings-card h3 { margin-bottom: 15px; color: #008069; }
        .setting-row { margin-bottom: 12px; text-align: left; }
        .setting-row label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; font-weight: bold; }
        .setting-row select, .setting-row input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 8px; }
        .close-settings { width: 100%; padding: 10px; background: #008069; color: white; border: none; border-radius: 8px; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .logout-btn-settings { width: 100%; padding: 10px; background: #d90429; color: white; border: none; border-radius: 8px; font-weight: bold; margin-top: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Auth / Login View -->
        <div id="auth-screen">
            <div class="auth-card">
                <h2>Welcome 💕</h2>

                <div class="tab-buttons">
                    <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Sign In</button>
                    <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Create Account</button>
                </div>

                <div id="error-box" class="error-msg"></div>

                <!-- Sign In Form -->
                <div id="login-form">
                    <input type="text" id="login-email" placeholder="Email">
                    <input type="password" id="login-password" placeholder="Password">
                    <button class="auth-btn" onclick="handleLogin()">Sign In</button>
                </div>

                <!-- Create Account Form -->
                <div id="register-form" style="display: none;">
                    <input type="text" id="reg-email" placeholder="Email">
                    <select id="reg-role">
                        <option value="boy">Boy</option>
                        <option value="girl">Girl</option>
                    </select>
                    <input type="password" id="reg-password" placeholder="Create Password">
                    <input type="password" id="reg-confirm-password" placeholder="Confirm Password">
                    <button class="auth-btn" onclick="handleRegister()">Create Account</button>
                </div>
            </div>
        </div>

        <!-- Main WhatsApp-Style View -->
        <div id="main-app">
            <div class="wa-header">
                <div class="wa-header-top">
                    <span>WhatsApp</span>
                    <div class="wa-header-icons">
                        <button>🔍</button>
                        <button onclick="openSettings()">⚙️</button>
                    </div>
                </div>
                <div class="wa-tabs">
                    <div class="wa-tab active">Chats</div>
                    <div class="wa-tab">Status</div>
                    <div class="wa-tab">Calls</div>
                </div>
            </div>

            <!-- Chat Panel List -->
            <div id="chat-panel">
                <div class="chat-item" onclick="openChatRoom()">
                    <img src="twoofus.png" class="avatar" alt="avatar">
                    <div class="chat-info">
                        <div class="chat-name">
                            <span id="partner-name">My Partner ❤️</span>
                            <span class="chat-time" id="last-time">12:00 PM</span>
                        </div>
                        <div class="chat-last-msg">
                            <span id="last-msg-preview">Tap to start messaging...</span>
                            <span class="unread-badge">1</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Individual Chat Room View -->
            <div id="chat-room">
                <div class="room-header">
                    <button class="back-btn" onclick="closeChatRoom()">←</button>
                    <span class="user-title" id="chat-header-title">My Partner ❤️</span>
                    <button onclick="startCall(false)">📞</button>
                    <button onclick="startCall(true)">📹</button>
                    <button onclick="openSettings()">⚙️</button>
                </div>

                <div id="video-container">
                    <button class="end-call-btn" onclick="endCall()">End</button>
                    <video id="remote-video" autoplay playsinline></video>
                    <video id="local-video" autoplay playsinline muted></video>
                </div>

                <div id="chat-box"></div>

                <div class="input-area">
                    <input type="text" id="message-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMessage()">
                    <button class="send-btn" onclick="sendMessage()">➔</button>
                </div>
            </div>
        </div>

        <!-- Settings Modal -->
        <div id="settings-modal">
            <div class="settings-card">
                <h3>App Settings</h3>

                <div class="setting-row">
                    <label>Font Color</label>
                    <input type="color" id="setting-color" value="#111111" onchange="updateFontColor(this.value)">
                </div>

                <div class="setting-row">
                    <label>Wallpaper Background</label>
                    <input type="file" id="setting-bg" accept="image/*" onchange="updateWallpaper(event)">
                </div>

                <div class="setting-row">
                    <label>Ringtone Sound</label>
                    <select id="setting-ringtone">
                        <option value="default.mp3">Classic Bell</option>
                        <option value="romantic.mp3">Chime</option>
                        <option value="silent">Silent</option>
                    </select>
                </div>

                <button class="close-settings" onclick="closeSettings()">Save & Close</button>
                <button class="logout-btn-settings" onclick="logout()">Log Out</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Modular Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, push, onValue, set, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDJ4eGBufpJ5jpV6yoZ91CiO40JOGeu1to",
            authDomain: "love-chat-7a40d.firebaseapp.com",
            databaseURL: "https://love-chat-7a40d-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "love-chat-7a40d",
            storageBucket: "love-chat-7a40d.firebasestorage.app",
            messagingSenderId: "940509187617",
            appId: "1:940509187617:web:c00bed772ef498be4c1d60",
            measurementId: "G-Q5L1Q6B3GD"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let myRole = localStorage.getItem('user_role');
        let peer = null;
        let currentCall = null;
        let localStream = null;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const snapshot = await get(child(ref(db), `users/${user.uid}`));
                if (snapshot.exists()) {
                    myRole = snapshot.val().role;
                    localStorage.setItem('user_role', myRole);
                    initApp();
                }
            } else {
                document.getElementById('auth-screen').style.display = 'flex';
                document.getElementById('main-app').style.display = 'none';
            }
        });

        window.switchTab = function(tab) {
            showError('');
            if (tab === 'login') {
                document.getElementById('tab-login').classList.add('active');
                document.getElementById('tab-register').classList.remove('active');
                document.getElementById('login-form').style.display = 'block';
                document.getElementById('register-form').style.display = 'none';
            } else {
                document.getElementById('tab-register').classList.add('active');
                document.getElementById('tab-login').classList.remove('active');
                document.getElementById('register-form').style.display = 'block';
                document.getElementById('login-form').style.display = 'none';
            }
        };

        function showError(msg) {
            const errBox = document.getElementById('error-box');
            if (msg) {
                errBox.textContent = msg;
                errBox.style.display = 'block';
            } else {
                errBox.style.display = 'none';
            }
        }

        window.handleRegister = async function() {
            const email = document.getElementById('reg-email').value.trim();
            const role = document.getElementById('reg-role').value;
            const password = document.getElementById('reg-password').value;
            const confirmPassword = document.getElementById('reg-confirm-password').value;

            if (!email || !password) { showError('Please fill in all fields.'); return; }
            if (password !== confirmPassword) { showError('Passwords do not match!'); return; }

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                await set(ref(db, 'users/' + user.uid), { role, email });
                localStorage.setItem('user_role', role);
                myRole = role;
            } catch (error) { showError(error.message); }
        };

        window.handleLogin = async function() {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            if (!email || !password) { showError('Please enter email and password.'); return; }

            try { await signInWithEmailAndPassword(auth, email, password); } 
            catch (error) { showError('Login failed: ' + error.message); }
        };

        window.logout = function() {
            signOut(auth).then(() => {
                localStorage.removeItem('user_role');
                location.reload();
            });
        };

        function initApp() {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'flex';

            const myPeerId = myRole === 'boy' ? 'love-app-boy' : 'love-app-girl';
            peer = new Peer(myPeerId);

            peer.on('call', async (call) => {
                if (confirm("Incoming call! Accept?")) {
                    const isVideo = confirm("Enable video?");
                    localStream = await navigator.mediaDevices.getUserMedia({ video: isVideo, audio: true });
                    setupVideoUI(isVideo, localStream);
                    call.answer(localStream);
                    call.on('stream', (remoteStream) => {
                        document.getElementById('remote-video').srcObject = remoteStream;
                    });
                    currentCall = call;
                }
            });

            listenForMessages();
        }

        window.openChatRoom = function() { document.getElementById('chat-room').style.display = 'flex'; };
        window.closeChatRoom = function() { document.getElementById('chat-room').style.display = 'none'; };

        window.openSettings = function() { document.getElementById('settings-modal').style.display = 'flex'; };
        window.closeSettings = function() { document.getElementById('settings-modal').style.display = 'none'; };

        window.updateFontColor = function(color) {
            document.getElementById('chat-box').style.color = color;
        };

        window.updateWallpaper = function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    document.getElementById('chat-room').style.backgroundImage = `url('${evt.target.result}')`;
                };
                reader.readAsDataURL(file);
            }
        };

        window.startCall = async function(videoEnabled) {
            const targetPeerId = myRole === 'boy' ? 'love-app-girl' : 'love-app-boy';
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: videoEnabled, audio: true });
                setupVideoUI(videoEnabled, localStream);
                const call = peer.call(targetPeerId, localStream);
                call.on('stream', (remoteStream) => {
                    document.getElementById('remote-video').srcObject = remoteStream;
                });
                currentCall = call;
            } catch (err) { alert("Microphone/Camera permission required!"); }
        };

        function setupVideoUI(videoEnabled, stream) {
            document.getElementById('video-container').style.display = 'block';
            document.getElementById('local-video').style.display = videoEnabled ? 'block' : 'none';
            document.getElementById('local-video').srcObject = stream;
        }

        window.endCall = function() {
            if (currentCall) currentCall.close();
            if (localStream) localStream.getTracks().forEach(track => track.stop());
            document.getElementById('video-container').style.display = 'none';
        };

        const chatBox = document.getElementById('chat-box');

        function listenForMessages() {
            const messagesRef = ref(db, 'messages');
            onValue(messagesRef, (snapshot) => {
                chatBox.innerHTML = '';
                const data = snapshot.val();
                if (data) {
                    const msgArray = Object.values(data);
                    msgArray.forEach(msg => {
                        const div = document.createElement('div');
                        // Crucial Left / Right Logic:
                        const isSentByMe = msg.sender === myRole;
                        div.className = `message ${isSentByMe ? 'sent' : 'received'}`;
                        div.textContent = msg.text;
                        chatBox.appendChild(div);
                    });

                    const lastMsg = msgArray[msgArray.length - 1];
                    if (lastMsg) {
                        document.getElementById('last-msg-preview').textContent = lastMsg.text;
                    }
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
            });
        }

        window.sendMessage = async function() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            const messagesRef = ref(db, 'messages');
            await push(messagesRef, {
                sender: myRole,
                text: text,
                timestamp: Date.now()
            });
        };
    </script>
</body>
</html>

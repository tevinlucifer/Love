<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz for You ❤️</title>
    <style>
        body { font-family: sans-serif; background: #ffe6e6; text-align: center; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        button { background: #ff4d6d; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 16px; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Quick Question!</h2>
        <p>What is my favorite memory of us?</p>
        <button onclick="alert('Correct! ❤️')">Our first trip</button><br>
        <button onclick="alert('Try again!')">Late night chats</button>
    </div>
</body>
</html>
